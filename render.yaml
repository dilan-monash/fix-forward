# Render deployment description for the approved public Main site; it does not provision or migrate Neon.
# It documents the existing, manually created fix-forward-main Python web service. Do not apply it as a
# Blueprint without first comparing it with the live service: that could create a duplicate service or replace settings.
# Secrets are supplied by hosting configuration, and app.py exposes the WSGI application imported below.
services:
  - type: web
    name: fix-forward-main
    runtime: python
    # Publish approved releases from main; the comparison services retain their own branches.
    branch: main
    # Publish manually after review, matching the existing Render service setting.
    autoDeployTrigger: "off"
    plan: free
    region: singapore
    # The build installs runtime dependencies and rebuilds the local reviewed-price SQLite/JavaScript snapshot.
    # It does not refresh retailer data or invoke the separate hosted-data import pipeline.
    buildCommand: pip install -r requirements.txt && python data/scripts/build_price_catalogue.py
    # Gunicorn serves app:app on the port provided by Render. Main opens publicly without a team password.
    startCommand: gunicorn --workers 2 --threads 2 --timeout 60 --bind 0.0.0.0:$PORT "app:app"
    # Liveness needs no Neon connection; /api/ready checks the read-only database separately.
    healthCheckPath: /api/health
    # sync:false values are configured outside this file; keep credentials out of source and frontend assets.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RELEASE_VERSION
        # Identifies Main in /api/health. The service Environment value wins;
        # update only Main's label when manually deploying this approved release.
        value: main-v3.0.0
      - key: SITE_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
