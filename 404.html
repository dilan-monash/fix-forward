<!doctype html>
<!-- Simple server not-found page. It uses adult styling and works without the app controller. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page not found | FixForward</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <!-- Share the I3 theme even when a typed URL does not match an application route. -->
  <link rel="stylesheet" href="/prototypes/i3-world-preview/world.css">
</head>
<body class="error-page">
  <!-- Explain the missing page and provide a direct route back to the adult home. -->
  <main class="page-width route-loading">
    <p class="eyebrow">Page not found · 404</p>
    <h1>We could not find this page.</h1>
    <p>The link may be out of date or the address may be incorrect. Open FixForward to start an appliance check.</p>
    <a class="button primary" href="/">Go to FixForward home</a>
  </main>
</body>
</html>
