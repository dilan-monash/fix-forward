<!doctype html>
<!-- The server returns this document with HTTP 404, without loading the app. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | FixForward</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <!-- Public error-page styling works even when the visitor has not logged in. -->
  <link rel="stylesheet" href="/404.css">
</head>
<body class="error-page">
  <!-- The visitor chooses to go home; a missing URL never redirects automatically. -->
  <main class="page-width route-loading">
    <p class="eyebrow">Page not found · 404</p>
    <h1>We could not find this page.</h1>
    <p>This page is no longer available, or the address may be incorrect.</p>
    <p>Head home to learn together or get help with an appliance.</p>
    <a class="button primary" href="/">Go to FixForward home</a>
  </main>
</body>
</html>
