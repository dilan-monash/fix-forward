<!doctype html>
<!-- Simple server-error page. No app state or API result is required to read this fallback. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Something went wrong | FixForward</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="error-page">
  <!-- Retain a practical return link and a safety reminder when the normal page cannot load. -->
  <main>
    <p class="eyebrow">Temporary problem · 500</p>
    <h1>We could not load this page.</h1>
    <p>Please try again in a moment. Returning home starts a new appliance check.</p>
    <p>If the appliance has a serious warning sign, stop using it and contact a qualified professional.</p>
    <a class="button primary" href="/">Go to FixForward home</a>
  </main>
</body>
</html>
